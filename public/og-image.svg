    <text x="74" y="23" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">compose.yaml</text>

    <g transform="translate(22, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="0" y="0" fill="#38bdf8">services:</text>
      <text x="16" y="24" fill="#e2e8f0">webapp:</text>
      <text x="32" y="48" fill="#94a3b8">image: <tspan fill="#bae6fd">ghcr.io/org/api:2.4</tspan></text>
      <text x="32" y="72" fill="#94a3b8">ports: <tspan fill="#cbd5e1">["8080:8080"]</tspan></text>
      <text x="32" y="96" fill="#94a3b8">volumes: <tspan fill="#cbd5e1">["./data:/var/lib/app"]</tspan></text>
      <text x="32" y="120" fill="#94a3b8">restart: <tspan fill="#6ee7b7">unless-stopped</tspan></text>
    </g>

    <g transform="translate(216, 206)">
      <rect x="0" y="0" width="44" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.4" />
      <path d="M22 8V23M22 23L16 17M22 23L28 17" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="476" height="234" rx="14" fill="#0b1120" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="1.8" />
      <rect x="0" y="0" width="476" height="36" rx="14" fill="#0f172a" />
      <line x1="0" y1="36" x2="476" y2="36" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="23" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">~/.config/containers/systemd/webapp.container</text>

      <g transform="translate(22, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
        <text x="0" y="0" fill="#38bdf8" font-weight="700">[Container]</text>
        <text x="0" y="23" fill="#e2e8f0">Image=<tspan fill="#bae6fd">ghcr.io/org/api:2.4</tspan></text>
        <text x="0" y="46" fill="#e2e8f0">Network=<tspan fill="#6ee7b7">webapp.network</tspan></text>
        <text x="0" y="69" fill="#e2e8f0">PublishPort=<tspan fill="#cbd5e1">8080:8080</tspan></text>
        <text x="0" y="92" fill="#e2e8f0">Volume=<tspan fill="#fde68a">./data:/var/lib/app:Z</tspan></text>
        <text x="0" y="120" fill="#38bdf8" font-weight="700">[Service]</text>
        <text x="0" y="143" fill="#e2e8f0">Restart=<tspan fill="#6ee7b7">always</tspan>   <tspan fill="#38bdf8" font-weight="700">[Install]</tspan> WantedBy=default.target</text>
      </g>
    </g>
  </g>
