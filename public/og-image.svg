<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#04111d" />
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 150) rotate(35) scale(460 320)">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emerald-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 480) rotate(-20) scale(440 300)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#cyan-glow)" />
  <rect width="1200" height="630" fill="url(#emerald-glow)" />
  <rect x="24" y="24" width="1152" height="582" rx="22" stroke="#1e293b" stroke-width="2" />

  <g transform="translate(72, 76)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#082f49" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8" />
    <text x="24" y="31" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">[Q]</text>
    <text x="64" y="32" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">QuadletGen</text>

    <rect x="244" y="9" width="268" height="30" rx="15" fill="#064e3b" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="262" cy="24" r="4.5" fill="#34d399" />
    <text x="275" y="29" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">100% CLIENT-SIDE YAML PARSER</text>

    <text x="0" y="128" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.2">Docker Compose to</text>
    <text x="0" y="188" fill="#38bdf8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.2">Podman Quadlet</text>

    <text x="0" y="242" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">Convert compose.yaml stacks and docker run flags into</text>
    <text x="0" y="272" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">declarative Linux systemd units with zero server uploads.</text>

    <g transform="translate(0, 318)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
      <rect x="0" y="0" width="112" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
      <text x="56" y="23" text-anchor="middle" fill="#7dd3fc">.container</text>

      <rect x="124" y="0" width="102" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
      <text x="175" y="23" text-anchor="middle" fill="#7dd3fc">.network</text>

      <rect x="238" y="0" width="96" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
      <text x="286" y="23" text-anchor="middle" fill="#7dd3fc">.volume</text>

      <rect x="346" y="0" width="150" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
      <text x="421" y="23" text-anchor="middle" fill="#6ee7b7">SELinux :z / :Z</text>
    </g>

    <g transform="translate(0, 430)">
      <text x="0" y="24" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">quadletgen.com</text>
      <text x="182" y="24" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16">|  Podman 4.4+ rootless and rootful systemd</text>
    </g>
  </g>

  <g transform="translate(652, 74)">
    <rect x="0" y="0" width="476" height="196" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.8" />
    <rect x="0" y="0" width="476" height="36" rx="14" fill="#0f172a" />
    <line x1="0" y1="36" x2="476" y2="36" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" fill-opacity="0.8" />
