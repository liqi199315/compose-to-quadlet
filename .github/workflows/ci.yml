name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Build and SEO Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_SITE_URL: https://quadletgen.com
      PUBLIC_GA4_MEASUREMENT_ID: G-PK7MR29S6E
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build CLI, static site, and release manifest
        run: npm run build

      - name: Run SEO and copy hygiene preflight
        run: npm run seo:check
